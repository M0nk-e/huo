[workspace]
members = ["huo-core", "huo-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["M0nk-e <monkeentropy@proton.me>"]
license = "MIT"
repository = "https://github.com/M0nk-e/huo"
homepage = "https://github.com/M0nk-e/huo"
keywords = ["manga", "downloader", "cli", "scraper"]
categories = ["command-line-utilities"]

[workspace.dependencies]
# Core dependencies
async-trait = "0.1.89"
chrono = "0.4.42"
dirs = "6.0.0"
regex = "1.12.2"
reqwest = { version = "0.12.26", features = ["json"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
urlencoding = "2.1"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12.0"
indicatif = "0.18.3"
ratatui = "0.29"
crossterm = "0.28"
